# SPDX-License-Identifier: LGPL-3.0-or-later

[package]
name = "fluxbridge"
version = "0.3.0"
edition = "2024"
rust-version = "1.93"
authors = ["Lee Hobson", "Copperline contributors"]
description = "Safe Rust access to real floppy drives over Greaseweazle, DrawBridge, and SuperCard Pro interfaces"
license = "LGPL-3.0-or-later AND MPL-2.0"
repository = "https://github.com/CopperlineHQ/FluxBridge"
readme = "README.md"
keywords = ["amiga", "floppy", "flux", "greaseweazle", "drawbridge"]
categories = ["hardware-support", "encoding"]
publish = false

[features]
default = ["drawbridge", "greaseweazle", "supercard-pro", "direct-ftdi"]
drawbridge = []
greaseweazle = []
supercard-pro = []
direct-ftdi = ["dep:ftdi-nusb"]
hardware-tests = []

[dependencies]
bitflags = "2.9"
crossbeam-channel = "0.5.16"
ftdi-nusb = { version = "0.2.0", optional = true }
serialport = { version = "4.9.0", default-features = false }
thiserror = "2.0.19"

[dev-dependencies]
hex = "0.4"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cast_possible_truncation = "allow"
doc_markdown = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
single_match_else = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"
